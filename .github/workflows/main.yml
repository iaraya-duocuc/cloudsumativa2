name: Test, publish and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        run: sh ./mvnw -B test

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t cloudsumativa2:ci .

      - name: Verify the API in Docker
        shell: bash
        run: |
          set -euo pipefail
          container=$(docker run --rm -d -p 127.0.0.1::8080 \
            -e ISSUER_URI=https://issuer.example.invalid \
            -e AUDIENCE=cloudsumativa2-ci cloudsumativa2:ci)
          trap 'docker stop "$container" >/dev/null 2>&1 || true' EXIT
          address=$(docker port "$container" 8080/tcp)

          for attempt in {1..30}; do
            if curl --fail --silent --output /dev/null --max-time 2 "http://$address/actuator/health" &&
              status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --max-time 2 "http://$address/eventos") && [[ "$status" == 401 ]]; then
              exit 0
            fi
            sleep 1
          done

          docker logs --tail 100 "$container"
          exit 1

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish the verified image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          image=ignarayaa/cloudsumativa2
          docker tag cloudsumativa2:ci "$image:$IMAGE_TAG"
          docker tag cloudsumativa2:ci "$image:latest"
          docker push "$image:$IMAGE_TAG"
          docker push "$image:latest"

  deploy:
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: cloudsumativa2-ec2
      cancel-in-progress: false
    steps:
      - name: Deploy the verified image to EC2
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          USER_SERVER: ${{ secrets.USER_SERVER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          ISSUER_URI: ${{ secrets.ISSUER_URI }}
          AUDIENCE: ${{ secrets.AUDIENCE }}
          MYSQL_JDBC_URL: ${{ secrets.MYSQL_JDBC_URL }}
          MYSQL_USERNAME: ${{ secrets.MYSQL_USERNAME }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          S3_ENABLED: ${{ secrets.S3_ENABLED }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          : "${EC2_HOST:?Missing EC2_HOST}" "${USER_SERVER:?Missing USER_SERVER}" "${EC2_SSH_KEY:?Missing EC2_SSH_KEY}"
          : "${MYSQL_JDBC_URL:?Missing MYSQL_JDBC_URL}" "${MYSQL_USERNAME:?Missing MYSQL_USERNAME}" "${MYSQL_PASSWORD:?Missing MYSQL_PASSWORD}"
          if [[ "$S3_ENABLED" == true ]]; then
            : "${S3_BUCKET:?Missing S3_BUCKET}"
            : "${AWS_ACCESS_KEY_ID:?Missing AWS_ACCESS_KEY_ID}" "${AWS_SECRET_ACCESS_KEY:?Missing AWS_SECRET_ACCESS_KEY}" "${AWS_SESSION_TOKEN:?Missing AWS_SESSION_TOKEN}"
          fi
          : "${ISSUER_URI:?Missing ISSUER_URI}" "${AUDIENCE:?Missing AUDIENCE}"
          umask 077
          key=$(mktemp)
          known_hosts=$(mktemp)
          trap 'rm -f "$key" "$known_hosts"' EXIT
          printf '%s\n' "$EC2_SSH_KEY" > "$key"

          {
            printf 'export ISSUER_URI=%q AUDIENCE=%q\n' "$ISSUER_URI" "$AUDIENCE"
            printf 'export MYSQL_JDBC_URL=%q MYSQL_USERNAME=%q MYSQL_PASSWORD=%q\n' \
              "$MYSQL_JDBC_URL" "$MYSQL_USERNAME" "$MYSQL_PASSWORD"
            printf 'export S3_ENABLED=%q S3_BUCKET=%q\n' "${S3_ENABLED:-false}" "$S3_BUCKET"
            if [[ "$S3_ENABLED" == true ]]; then
              printf 'export AWS_ACCESS_KEY_ID=%q AWS_SECRET_ACCESS_KEY=%q AWS_SESSION_TOKEN=%q\n' \
                "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" "$AWS_SESSION_TOKEN"
            fi
            cat <<'REMOTE'
          set -euo pipefail
          image="ignarayaa/cloudsumativa2:$1"
          container=cloudsumativa2
          backup="${container}-previous"
          efs_mount=/mnt/efs
          tickets_path="$efs_mount/cloudsumativa2/tickets"

          if ! findmnt -rn -t nfs,nfs4 --mountpoint "$efs_mount" >/dev/null; then
            echo "Deployment aborted: EFS is not mounted at $efs_mount." >&2
            exit 1
          fi

          docker pull "$image"
          if docker container inspect "$backup" >/dev/null 2>&1; then
            echo "A previous deployment left $backup behind. Resolve it before retrying." >&2
            exit 1
          fi

          docker run --rm --entrypoint sh \
            --mount "type=bind,source=$efs_mount,target=/efs" "$image" \
            -ec 'mkdir -p /efs/cloudsumativa2/tickets && test -w /efs/cloudsumativa2/tickets'

          if docker container inspect "$container" >/dev/null 2>&1; then
            docker stop "$container"
            docker rename "$container" "$backup"
          fi

          if docker run -d --name "$container" --restart unless-stopped \
            -p 8080:8080 \
            -e SPRING_PROFILES_ACTIVE=mysql \
            -e ISSUER_URI -e AUDIENCE \
            -e MYSQL_JDBC_URL -e MYSQL_USERNAME -e MYSQL_PASSWORD \
            -e S3_ENABLED -e S3_BUCKET \
            -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_SESSION_TOKEN \
            --mount "type=bind,source=$tickets_path,target=/app/storage/tickets" \
            "$image"; then
            for attempt in {1..30}; do
              if curl --fail --silent --output /dev/null --max-time 2 http://127.0.0.1:8080/actuator/health &&
                status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
                --max-time 2 http://127.0.0.1:8080/eventos) && [[ "$status" == 401 ]]; then
                if docker container inspect "$backup" >/dev/null 2>&1; then
                  docker rm "$backup"
                fi
                echo "Deployment verified: health check passed and GET /eventos required authentication."
                exit 0
              fi
              sleep 1
            done
          fi

          if docker container inspect "$container" >/dev/null 2>&1; then
            docker logs --tail 100 "$container" || true
            docker rm -f "$container"
          fi
          if docker container inspect "$backup" >/dev/null 2>&1; then
            docker rename "$backup" "$container"
            docker start "$container"
          fi
          exit 1
          REMOTE
          } | ssh -i "$key" -l "$USER_SERVER" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known_hosts" \
            -- "$EC2_HOST" bash -s -- "$IMAGE_TAG"
