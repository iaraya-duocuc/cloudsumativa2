name: Test, publish and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        run: sh ./mvnw -B test

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t cloudsumativa2:ci .

      - name: Verify the API in Docker
        shell: bash
        run: |
          set -euo pipefail
          container=$(docker run --rm -d -p 127.0.0.1::8080 cloudsumativa2:ci)
          trap 'docker stop "$container" >/dev/null 2>&1 || true' EXIT
          address=$(docker port "$container" 8080/tcp)

          for attempt in {1..30}; do
            if response=$(curl --fail --silent --max-time 2 "http://$address/eventos") &&
              [[ "$response" == "[]" ]]; then
              exit 0
            fi
            sleep 1
          done

          docker logs --tail 100 "$container"
          exit 1

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish the verified image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          image=ignarayaa/cloudsumativa2
          docker tag cloudsumativa2:ci "$image:$IMAGE_TAG"
          docker tag cloudsumativa2:ci "$image:latest"
          docker push "$image:$IMAGE_TAG"
          docker push "$image:latest"

  deploy:
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: cloudsumativa2-ec2
      cancel-in-progress: false
    steps:
      - name: Deploy the verified image to EC2
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          USER_SERVER: ${{ secrets.USER_SERVER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          : "${EC2_HOST:?Missing EC2_HOST}" "${USER_SERVER:?Missing USER_SERVER}" "${EC2_SSH_KEY:?Missing EC2_SSH_KEY}"
          umask 077
          key=$(mktemp)
          known_hosts=$(mktemp)
          trap 'rm -f "$key" "$known_hosts"' EXIT
          printf '%s\n' "$EC2_SSH_KEY" > "$key"

          ssh -i "$key" -l "$USER_SERVER" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known_hosts" \
            -- "$EC2_HOST" bash -s -- "$IMAGE_TAG" <<'REMOTE'
          set -euo pipefail
          image="ignarayaa/cloudsumativa2:$1"
          container=cloudsumativa2
          backup="${container}-previous"

          docker pull "$image"
          if docker container inspect "$backup" >/dev/null 2>&1; then
            echo "A previous deployment left $backup behind. Resolve it before retrying." >&2
            exit 1
          fi

          if docker container inspect "$container" >/dev/null 2>&1; then
            docker stop "$container"
            docker rename "$container" "$backup"
          fi

          if docker run -d --name "$container" --restart unless-stopped \
            -p 127.0.0.1:8080:8080 \
            -v cloudsumativa2-data:/app/data \
            -v cloudsumativa2-tickets:/app/storage/tickets \
            "$image"; then
            for attempt in {1..30}; do
              if curl --fail --silent --max-time 2 http://127.0.0.1:8080/eventos >/dev/null; then
                if docker container inspect "$backup" >/dev/null 2>&1; then
                  docker rm "$backup"
                fi
                echo "Deployment verified: GET /eventos returned success."
                exit 0
              fi
              sleep 1
            done
          fi

          if docker container inspect "$container" >/dev/null 2>&1; then
            docker logs --tail 100 "$container" || true
            docker rm -f "$container"
          fi
          if docker container inspect "$backup" >/dev/null 2>&1; then
            docker rename "$backup" "$container"
            docker start "$container"
          fi
          exit 1
          REMOTE
